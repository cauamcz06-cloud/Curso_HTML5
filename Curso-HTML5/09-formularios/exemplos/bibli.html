<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Referência Bibliográfica</title>
</head>
<body>

    <header>
        <h1>CADASTRO DE REFERÊNCIA BIBLIOGRÁFICA</h1>
        <p>Cadastre os livros recomendados para as disciplinas.</p>
    </header>

    <main>
        <section>
            <form action="/salvar-livro" method="POST">
                
            
                <fieldset>
                    <legend>Informações da Obra</legend>
                    
                    <div>
                        <label for="titulo">Título do Livro:</label><br>
                        <input type="text" id="titulo" name="titulo" required>
                    </div>
                    <br>

                    <div>
                        <label for="autor">Autor(es):</label><br>
                        <input type="text" id="autor" name="autor" required>
                    </div>
                    <br>

                    <div>
                        <label for="isbn">ISBN (13 dig.):</label><br>
                        <input type="text" id="isbn" name="isbn" pattern="[0-9]{13}" maxlength="13" placeholder="Ex: 9788535284485" required>
                    </div>
                    <br>

                    <div>
                        <label for="ano">Ano de Publicação:</label><br>
                        <input type="number" id="ano" name="ano" placeholder="Ex: 2023" required>
                    </div>
                </fieldset>

                <br>

            
                <fieldset>
                    <legend>Detalhes Acadêmicos</legend>
                    
                    <div>
                        <label for="curso">Curso Alvo:</label><br>
                        <select id="curso" name="curso" required>
                            <option value="" disabled selected>Selecione o curso...</option>
                            <option value="Engenharia de Software">Engenharia de Software</option>
                            <option value="Análise e Desenv. de Sistemas">Análise e Desenv. de Sistemas</option>
                            <option value="Tronco Comum">Tronco Comum</option>
                        </select>
                    </div>
                    <br>

                    <div>
                        <label for="disciplina">Disciplina:</label><br>
                        <input type="text" id="disciplina" name="disciplina" required>
                    </div>
                    <br>

                    <div>
                        <label>Formato:</label><br>
                        <input type="radio" id="fisico" name="formato" value="Físico" required>
                        <label for="fisico">Físico</label>
                        
                        <input type="radio" id="digital" name="formato" value="Digital" required>
                        <label for="digital">Digital</label>
                        
                        <input type="radio" id="hibrido" name="formato" value="Híbrido" required>
                        <label for="hibrido">Híbrido</label>
                    </div>
                </fieldset>

                <br>
                
                <div>
                    <button type="submit">Salvar Livro</button>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
